info:
  name: Query Device By Id
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/app/device/queryDeviceById?lang=en"
  params:
    - name: lang
      value: en
      type: query
  body:
    type: json
    data: |-
      {
        "deviceId": "{{device_id}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const productId = res.body?.objectResult?.productId;

        if (productId) {
          bru.setEnvVar("product_id", productId);
          console.log("product_id captured: " + productId);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **Probed (2026-11).** `objectResult` has `deviceCode`, `productId` and
  `deviceStatus` (`ONLINE` or `OFFLINE`).

  It also hands out `deviceSecret` and `productKey`, credentials of the
  device's Wi-Fi module, to any session on the account. Don't paste the
  response anywhere public.
