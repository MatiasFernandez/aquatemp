info:
  name: Set Target Temperature
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/app/device/control"
  body:
    type: json
    data: |-
      {
        "param": [
          {
            "deviceCode": "{{device_code}}",
            "protocolCode": "R02",
            "value": 26
          },
          {
            "deviceCode": "{{device_code}}",
            "protocolCode": "Set_Temp",
            "value": 26
          }
        ]
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  **From the integration.** The same temperature goes in one request twice:
  to the target code of the current mode, and to the profile's
  `temperature` code. Both come from the device's profile. In the
  `default` mapping the targets are `R01` cool, `R02` heat, `R03` auto,
  with the limits in `R08`-`R11`, and the `temperature` code is
  `Set_Temp`. Hitemp (`1245226668902080512`) uses `R01` for both. The body
  above is heat in the `default` mapping; take both codes from the
  device's profile and mode.

  Nothing is sent when the target code doesn't read as a setpoint: the
  mode has no target code (as `off`), a reading isn't a number, the mode's
  limits are the wrong way round, or the target's current value or the new
  one is outside them. Limits the device doesn't report don't stop a write.
  A Planet Pool TEP0002 owner reported heat's `R02` holding the hysteresis
  (0.5) with `R10`/`R11` at 35/27, so a write there overwrote it
  (radical-squared/aquatemp#122; not probed here).
  Hitemp's profile maps no limit codes, so its limits are `R01`'s own
  `rangeStart`/`rangeEnd` from Get Data By Code.
