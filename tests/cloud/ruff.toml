# The cloud library's tests: no Home Assistant, no knowledge of the integration
extend = "../../pyproject.toml"

# First-party detection looks in src, which defaults to this folder
src = ["../.."]

[lint]
extend-select = ["TID251", "TID252"]

[lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# The same list as cloud/ruff.toml: add new top-level modules to both
[lint.flake8-tidy-imports.banned-api]
"homeassistant".msg = "The cloud library's tests must not depend on Home Assistant"
"custom_components.aqua_temp.binary_sensor".msg = "The cloud library's tests must not know the integration"
"custom_components.aqua_temp.climate".msg = "The cloud library's tests must not know the integration"
"custom_components.aqua_temp.common".msg = "The cloud library's tests must not know the integration"
"custom_components.aqua_temp.config_flow".msg = "The cloud library's tests must not know the integration"
"custom_components.aqua_temp.diagnostics".msg = "The cloud library's tests must not know the integration"
"custom_components.aqua_temp.managers".msg = "The cloud library's tests must not know the integration"
"custom_components.aqua_temp.models".msg = "The cloud library's tests must not know the integration"
"custom_components.aqua_temp.select".msg = "The cloud library's tests must not know the integration"
"custom_components.aqua_temp.sensor".msg = "The cloud library's tests must not know the integration"
