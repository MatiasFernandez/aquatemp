[project]
# Not a Python package: the environment for testing the oldest supported Home Assistant
# (hacs.json). Run from the repository root, so pytest uses the root pyproject.toml's
# configuration:
#   uv run --project tests/floor --locked pytest
# A project of its own, kept out of the root uv.lock, which holds the latest Home
# Assistant: Dependabot can't bump a lock that also pins the floor. Dependabot only
# watches the root, so this moves with hacs.json, by hand. .python-version picks the
# floor's minimum Python.
name = "aqua-temp-floor"
version = "0"
requires-python = ">=3.13.2"
dependencies = [
    # The release whose homeassistant pin is hacs.json's minimum
    "pytest-homeassistant-custom-component==0.13.294",
    # Home Assistant 2025.11.0's aiodns 3.5.0 breaks with pycares 5
    "pycares<5",
    "aioresponses",
    "aiofiles",
    "xmltodict",
]

[tool.uv]
package = false
