repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=hass,protocal
          - --quiet-level=2
        exclude_types: [csv, json, svg, xml]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        exclude: ^(tests/floor/)?uv\.lock$ # generated; Home Assistant alone makes each ~1 MB
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.10
    hooks:
      - id: prettier
        # written by utils/show-profile.py --write-references
        exclude: ^tests/(cloud/resolved_profiles|integration/resolved_entity_names)\.json$
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  # Runs in the project's uv environment, where Home Assistant and the other
  # dependencies are installed for ty to follow. Checks the paths configured
  # in pyproject.toml, not just the changed files
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run --locked ty check
        language: system
        # Also when its configuration or the accepted errors change
        files: \.py$|^pyproject\.toml$|^ty-baseline\.json$
        pass_filenames: false
