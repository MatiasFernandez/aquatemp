[project]
# Not a Python package: Home Assistant loads the integration from custom_components/,
# and manifest.json holds its version. This section only describes the dev environment.
name = "aqua-temp"
version = "0"
requires-python = ">=3.13.2"
dependencies = [
    "aiofiles",
    "aiohttp",
    "cryptography",
    "homeassistant>=2025.11.0",  # hacs.json minimum
    "voluptuous",
    "xmltodict",
]

[dependency-groups]
dev = [
    "aioresponses>=0.7.9",
    "mutmut>=3.8.0",
    "pre-commit>=4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.ruff]
# Minimum Python of the oldest supported Home Assistant (hacs.json)
target-version = "py313"

[tool.ruff.lint]
select = [
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "PGH004", # blanket noqa
    "RUF100", # unused noqa
    "S103", "S108", "S306", "S307", "S313", "S314", "S315", "S316", "S317",
    "S318", "S319", "S601", "S602", "S604", "S608", "S609",  # bandit subset
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "E501", # line too long, handled by the formatter
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components/aqua_temp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mutmut]
# The modules the tests drive; add others as tests reach them
source_paths = [
    "custom_components/aqua_temp/managers/aqua_temp_api.py",
    "custom_components/aqua_temp/managers/aqua_temp_config_manager.py",
]
also_copy = ["custom_components"]
