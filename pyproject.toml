[tool.ruff]
# Minimum Python of the oldest supported Home Assistant (hacs.json)
target-version = "py313"

[tool.ruff.lint]
select = [
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "PGH004", # blanket noqa
    "RUF100", # unused noqa
    "S103", "S108", "S306", "S307", "S313", "S314", "S315", "S316", "S317",
    "S318", "S319", "S601", "S602", "S604", "S608", "S609",  # bandit subset
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "E501", # line too long, handled by the formatter
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 25
