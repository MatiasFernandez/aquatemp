[project]
# Not a Python package: Home Assistant loads the integration from custom_components/,
# and manifest.json holds its version. This section only describes the dev environment,
# which runs the latest Home Assistant: requires-python is that release's minimum Python,
# so Dependabot (which resolves at the lowest Python allowed) can bump the plugin below
name = "aqua-temp"
version = "0"
requires-python = ">=3.14.2"
dependencies = [
    "aiofiles",
    "aiohttp",
    "cryptography",
    "homeassistant>=2025.11.0",  # hacs.json minimum
    "voluptuous",
    "xmltodict",
]

[dependency-groups]
dev = [
    # Unreleased fix for aiohttp 3.14 (pnuckowski/aioresponses#288); back to a release once it ships
    "aioresponses @ git+https://github.com/agners/aioresponses@8f40e0db2eed16621607ecfc857168240c795755",
    "mutmut>=3.8.1",
    "pre-commit>=4",
    "pytest-cov>=7.1.0",
    # Pins homeassistant, pytest and pytest-asyncio exactly: the latest stable Home
    # Assistant, which Dependabot moves. The oldest supported one is tested from its
    # own project, tests/floor/, on the older pytest-homeassistant-custom-component
    "pytest-homeassistant==2026.11.2",
    # Exact: ty is in beta and its releases change what it reports, so a new
    # version arrives as a Dependabot PR that shows any new errors
    "ty==0.0.104",
]

[tool.uv]
package = false

[tool.ruff]
# Minimum Python of the oldest supported Home Assistant (hacs.json), not the
# dev environment's: keeps the code runnable there
target-version = "py313"

[tool.ruff.lint]
select = [
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "PGH004", # blanket noqa
    "RUF100", # unused noqa
    "S103", "S108", "S306", "S307", "S313", "S314", "S315", "S316", "S317",
    "S318", "S319", "S601", "S602", "S604", "S608", "S609",  # bandit subset
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "E501", # line too long, handled by the formatter
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ty]
# Errors the code had when ty was added, accepted until fixed: ty fails only on
# new ones. See CONTRIBUTING.md
baseline = "ty-baseline.json"

[tool.ty.src]
# The integration only; the tests and developer scripts aren't checked. ty
# checks the bodies of unannotated functions too, without requiring annotations
include = ["custom_components/aqua_temp"]

[tool.ty.environment]
# Minimum Python of the oldest supported Home Assistant, like ruff's target-version
python-version = "3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# As pytest-homeassistant's README asks: each test's fixtures get their own event loop
asyncio_default_fixture_loop_scope = "function"
# Temporary, also from that README. Importing homeassistant (2026.11 on) aliases httpx
# to httpx2 and raises if httpx was already imported, which respx's pytest plugin does
# when pytest loads it. Whether that happens depends on the order pytest loads plugins
# in, so the run can fail on one machine and pass on another. Only the plugin is
# disabled: the harnesses still use respx itself. Remove once pytest-homeassistant's
# README no longer asks for it.
addopts = "-p no:respx"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components/aqua_temp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mutmut]
# The whole integration: the cloud tests drive the cloud library, the
# integration tests the Home Assistant side
source_paths = ["custom_components/aqua_temp"]
also_copy = ["custom_components"]
# Log calls, whole even when split over lines: their mutants only change the log
# output, so most survive as noise. See CONTRIBUTING.md
do_not_mutate_patterns = ['_LOGGER\.(debug|info|warning|error|exception)\(']
# Runs the tests only in child processes: a Home Assistant instance the
# integration tests leave behind crashes mutmut's own process on exit otherwise
process_isolation = "forkserver"
