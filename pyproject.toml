[project]
# Not a Python package: Home Assistant loads the integration from custom_components/,
# and manifest.json holds its version. This section only describes the dev environment,
# which runs the latest Home Assistant: requires-python is that release's minimum Python,
# so Dependabot (which resolves at the lowest Python allowed) can bump the plugin below
name = "aqua-temp"
version = "0"
requires-python = ">=3.14.2"
dependencies = [
    "aiofiles",
    "aiohttp",
    "cryptography",
    "homeassistant>=2025.11.0",  # hacs.json minimum
    "voluptuous",
    "xmltodict",
]

[dependency-groups]
dev = [
    # Unreleased fix for aiohttp 3.14 (pnuckowski/aioresponses#288); back to a release once it ships
    "aioresponses @ git+https://github.com/agners/aioresponses@8f40e0db2eed16621607ecfc857168240c795755",
    "mutmut>=3.8.0",
    "pre-commit>=4",
    # Pins homeassistant, pytest, pytest-asyncio and pytest-cov exactly: the latest
    # stable Home Assistant, which Dependabot moves. The oldest supported one is
    # tested from its own project, tests/floor/
    "pytest-homeassistant-custom-component==0.13.374",
]

[tool.uv]
package = false

[tool.ruff]
# Minimum Python of the oldest supported Home Assistant (hacs.json), not the
# dev environment's: keeps the code runnable there
target-version = "py313"

[tool.ruff.lint]
select = [
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "PGH004", # blanket noqa
    "RUF100", # unused noqa
    "S103", "S108", "S306", "S307", "S313", "S314", "S315", "S316", "S317",
    "S318", "S319", "S601", "S602", "S604", "S608", "S609",  # bandit subset
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "E501", # line too long, handled by the formatter
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["custom_components/aqua_temp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mutmut]
# The whole integration: the cloud tests drive the cloud library, the
# integration tests the Home Assistant side
source_paths = ["custom_components/aqua_temp"]
also_copy = ["custom_components"]
# Log calls, whole even when split over lines: their mutants only change the log
# output, so most survive as noise. See CONTRIBUTING.md
do_not_mutate_patterns = ['_LOGGER\.(debug|info|warning|error|exception)\(']
# Runs the tests only in child processes: a Home Assistant instance the
# integration tests leave behind crashes mutmut's own process on exit otherwise
process_isolation = "forkserver"
