name: Validate

# yamllint disable-line rule:truthy
on:
  push:
    branches: [main, "release-*"]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# hacs/action and hassfest track their default branch on purpose: validation
# rules must follow current Home Assistant, which a pinned SHA would freeze.
jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hacs/action@main # zizmor: ignore[unpinned-uses]
        with:
          category: integration
          # No upstream license exists (fork chain), so the license check cannot pass.
          # Remove once https://github.com/radical-squared/aquatemp/issues/134 is resolved.
          ignore: license

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master # zizmor: ignore[unpinned-uses]
