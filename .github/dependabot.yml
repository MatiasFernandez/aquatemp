version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Home Assistant pins its own dependencies exactly, so transitive
    # updates can't resolve until a homeassistant bump brings them in.
    allow:
      - dependency-type: direct
